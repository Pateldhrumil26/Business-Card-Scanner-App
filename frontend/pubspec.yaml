name: frontend
description: "Business Card Scanner & Contact Manager Flutter Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management & Storage
  provider: ^6.1.2
  shared_preferences: ^2.3.5

  # Networking & Utilities
  dio: ^5.7.0
  intl: ^0.20.2
  path_provider: ^2.1.5

  # Camera, Images & OCR
  google_mlkit_text_recognition: ^0.14.0
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image: ^4.3.0

  # Device Features
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

  # UI Enhancements
  flutter_spinkit: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
